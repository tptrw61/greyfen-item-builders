<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Improvised guard</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1a;
        color: #e0e0e0;
        margin: 0;
        padding: 20px;
        line-height: 1.5;
    }
    .card {
        max-width: 640px;
        margin: 0 auto;
        background-color: #2d2d2d;
        border: 2px solid #444;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .item-name {
        color: #ffd700;
        font-size: 1.5em;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        margin: 0 0 14px;
        border-bottom: 2px solid #444;
        padding-bottom: 10px;
    }
    .rarity-box {
        text-align: center;
        border: 2px solid #444;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 14px;
        background-color: #242424;
    }
    .rarity-box .label {
        font-size: 0.75em;
        color: #9a9a9a;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .rarity-box .value {
        font-size: 1.6em;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 14px;
    }
    .sum-cell {
        background-color: #242424;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 8px 10px;
    }
    .sum-cell .label {
        font-size: 0.72em;
        color: #9a9a9a;
        text-transform: uppercase;
    }
    .sum-cell .val {
        font-size: 1.15em;
        font-weight: bold;
        color: #ffd700;
        font-family: Consolas, monospace;
    }
    h3 {
        color: #a8dadc;
        font-size: 0.95em;
        margin: 14px 0 6px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .stat-list { list-style: none; margin: 0; padding: 0; }
    .stat-list li {
        display: flex;
        flex-direction: column;
        padding: 3px 0;
        border-bottom: 1px dashed #3a3a3a;
        font-size: 0.9em;
    }
    .stat-list li span:first-child { color: #bde0fe; }
    .stat-list li span:last-child { font-weight: bold; margin-left: auto; text-align: right; }
</style>
</head>
<body>
<div class="card">
<h1 class="item-name">Improvised guard</h1>
<div style="text-align:center;color:#a8dadc;text-transform:uppercase;letter-spacing:2px;font-size:0.78em;margin:2px 0 14px;">Shield &middot; off-hand</div>
<div class="rarity-box"><div class="label">Rarity</div><div class="value" style="color:#9e9e9e">Crude</div></div>
<div class="summary-grid"><div class="sum-cell"><div class="label">Total RP</div><div class="val">15</div></div><div class="sum-cell"><div class="label">Value (SP)</div><div class="val">30</div></div><div class="sum-cell"><div class="label">Total Stacks</div><div class="val">1</div></div><div class="sum-cell"><div class="label">Max Stacks</div><div class="val">10</div></div></div>
<h3>Components</h3>
<ul class="stat-list"><li><span>Material</span><span>4 (Min 3)</span></li><li><span>Refinement</span><span>0 (Min 0)</span></li><li><span>Power</span><span>0 (Min 0)</span></li><li><span>Slots</span><span>3</span></li><li><span>Hands</span><span>1</span></li></ul>
<h3>Resulting Stats</h3>
<ul class="stat-list"><li><span>Block</span><span>1d4</span></li><li><span>Hands</span><span>1</span></li></ul>
</div>
</body>
</html>
